name: Rust Build Google Pack

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ၁။ Linux ပေါ်တွင် WebAssembly (Wasm) ကို Build လုပ်မည့်အပိုင်း
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # အမည်မရွေးဘဲ မည်သည့် zip ဖိုင်ကိုမဆို ရှာဖွေပြီး ဖြည်ခိုင်းခြင်း
      - name: Unzip and Move Files
        run: |
          mkdir extracted_temp
          find . -maxdepth 1 -name "*.zip" -exec unzip {} -d extracted_temp \;
          
          # Folder ဖွဲ့စည်းပုံကို စစ်ဆေးပြီး ဖိုင်များကို အပြင်သို့ ထုတ်ခြင်း
          if [ -d extracted_temp/google-pack ]; then
            mv extracted_temp/google-pack/* .
            mv extracted_temp/google-pack/.* . 2>/dev/null || true
          elif [ -d extracted_temp/pack ]; then
            mv extracted_temp/pack/* .
            mv extracted_temp/pack/.* . 2>/dev/null || true
          else
            find extracted_temp -mindepth 1 -maxdepth 1 -type d -exec sh -c 'mv "$1"/* . && mv "$1"/.* . 2>/dev/null || true' _ {} \;
          fi
          rm -rf extracted_temp
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo install wasm-pack
          
      - name: Build Source
        run: cargo build
        
      - name: Build WASM
        run: |
          # pack-wasm folder ကို လိုက်ရှာပြီး wasm build လုပ်ခြင်း
          WASM_DIR=$(find . -type d -name "pack-wasm" -print -quit)
          if [ -n "$WASM_DIR" ]; then
            wasm-pack build --dev --target web "$WASM_DIR"
          else
            echo "pack-wasm folder not found anywhere in the repository"
            exit 1
          fi
        
      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-pack-web-wasm
          path: "**/pack-wasm/pkg/"

  # ၂။ Windows ပေါ်တွင် Native .exe ဖိုင်ကို Build လုပ်မည့်အပိုင်း
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Windows ပေါ်တွင် မည်သည့် zip ဖိုင်ကိုမဆို ရှာဖွေပြီး ဖြည်ခိုင်းခြင်း
      - name: Unzip and Move Files on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extracted_temp
          $zipFile = Get-ChildItem -Filter *.zip | Select-Object -First 1
          if ($zipFile) {
              Expand-Archive -Path $zipFile.FullName -DestinationPath extracted_temp
              $subDir = Get-ChildItem -Path extracted_temp -Directory | Select-Object -First 1
              if ($subDir) {
                  Move-Item -Path "$($subDir.FullName)/*" -Destination "."
              } else {
                  Move-Item -Path "extracted_temp/*" -Destination "."
              }
          } else {
              echo "No zip file found in root"
              exit 1
          }
          Remove-Item -Recurse -Force extracted_temp

      - name: Install Protobuf on Windows
        run: choco install protoc -y

      - name: Build Windows EXE
        run: cargo build --release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: google-pack-windows-exe
          path: "**/target/release/*.exe"
