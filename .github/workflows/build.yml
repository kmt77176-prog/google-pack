name: Rust Build Google Pack

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ၁။ Linux ပေါ်တွင် WebAssembly (Wasm) ကို Build လုပ်မည့်အပိုင်း
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Zip ဖိုင်ကို ဖြည်ပြီး Folder တည်နေရာအမှန်ကို ရှာခိုင်းခြင်း
      - name: Unzip and Move Files
        run: |
          unzip pack.zip -d extracted_temp
          # Zip ထဲတွင် Folder ထပ်ပါနေပါက ဖိုင်အားလုံးကို Root သို့ ဆွဲထုတ်ခြင်း
          if [ -d extracted_temp/google-pack ]; then
            mv extracted_temp/google-pack/* .
            mv extracted_temp/google-pack/.* . 2>/dev/null || true
          elif [ -d extracted_temp/pack ]; then
            mv extracted_temp/pack/* .
            mv extracted_temp/pack/.* . 2>/dev/null || true
          else
            mv extracted_temp/* . 2>/dev/null || true
          fi
          rm -rf extracted_temp
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo install wasm-pack
          
      - name: Build Source
        run: cargo build
        
      - name: Build WASM
        run: |
          if [ -d "./pack-wasm" ]; then
            wasm-pack build --dev --target web ./pack-wasm
          else
            echo "pack-wasm folder not found at root"
            exit 1
          fi
        
      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-pack-web-wasm
          path: ./pack-wasm/pkg/

  # ၂။ Windows ပေါ်တွင် Native .exe ဖိုင်ကို Build လုပ်မည့်အပိုင်း
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Windows ပေါ်တွင် Zip ဖြည်ပြီး Folder တည်နေရာ ညှိခြင်း
      - name: Unzip and Move Files on Windows
        shell: pwsh
        run: |
          Expand-Archive -Path pack.zip -DestinationPath extracted_temp
          if (Test-Path "extracted_temp/google-pack") {
              Move-Item -Path "extracted_temp/google-pack/*" -Destination "."
          } elseif (Test-Path "extracted_temp/pack") {
              Move-Item -Path "extracted_temp/pack/*" -Destination "."
          } else {
              Move-Item -Path "extracted_temp/*" -Destination "."
          }
          Remove-Item -Recurper-Force extracted_temp

      - name: Install Protobuf on Windows
        run: choco install protoc -y

      - name: Build Windows EXE
        run: cargo build --release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: google-pack-windows-exe
          path: target/release/pack.exe
  
